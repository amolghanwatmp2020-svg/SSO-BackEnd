# azure-pipelines-backend.yml
trigger:
- azure-pipelines # or your working branch name

pool:
  vmImage: 'windows-latest' # Using a Windows agent for a .NET project is a good practice

variables:
  buildConfiguration: 'Release'

stages:
- stage: BuildBackend
  displayName: 'Build and package .NET Core API'
  jobs:
  - job: BuildJob
    displayName: 'Build .NET Core API'
    steps:
    - task: NodeTool@0
      displayName: 'Install Node.js'
      inputs:
        versionSpec: '18.x'

    - task: Npm@1
      displayName: 'Install Angular dependencies'
      inputs:
        command: 'install'
        workingDir: 'frontend/'

    - task: Npm@1
      displayName: 'Build Angular app'
      inputs:
        command: 'custom'
        customCommand: 'run build -- --configuration=production'
        workingDir: 'frontend/'

    - task: PublishBuildArtifacts@1
      displayName: 'Publish Angular Artifact'
      inputs:
        PathtoPublish: 'frontend/dist/your-angular-project-name' # Adjust path
        ArtifactName: 'angular-drop'
        publishLocation: 'Container'

    - task: DotNetCoreCLI@2
      displayName: 'Restore NuGet packages'
      inputs:
        command: 'restore'
        projects: 'SingleSignOn.csproj' # Adjust this path

    - task: DotNetCoreCLI@2
      displayName: 'Build .NET Core app'
      inputs:
        command: 'build'
        projects: 'SingleSignOn.csproj'
        arguments: '--configuration Release'

    - task: DotNetCoreCLI@2
      displayName: 'Run tests'
      inputs:
        command: 'test'
        projects: 'SingleSignOn.csproj'

    - task: DotNetCoreCLI@2
      displayName: 'Publish .NET Core app'
      inputs:
        command: 'publish'
        publishWebProjects: true

    - task: PublishBuildArtifacts@1
      displayName: 'Publish .NET Core Artifact'
      inputs:
        PathtoPublish: '$(Build.ArtifactStagingDirectory)'
        ArtifactName: 'dotnet-drop'
        publishLocation: 'Container'