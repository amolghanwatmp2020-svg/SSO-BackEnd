trigger:
- main # Or the branch you want to use

pool:
  vmImage: 'ubuntu-latest' # Or 'windows-latest'

variables:
  buildConfiguration: 'Release'

stages:
- stage: Build
  displayName: 'Build Frontend and Backend'
  jobs:
  - job: BuildJob
    displayName: 'Build and package applications'
    steps:
    - task: NodeTool@0
      displayName: 'Install Node.js'
      inputs:
        versionSpec: '18.x'

    - task: Npm@1
      displayName: 'Install Angular dependencies'
      inputs:
        command: 'install'
        workingDir: 'frontend/'

    - task: Npm@1
      displayName: 'Build Angular app'
      inputs:
        command: 'custom'
        customCommand: 'run build -- --configuration=production'
        workingDir: 'frontend/'

    - task: PublishBuildArtifacts@1
      displayName: 'Publish Angular Artifact'
      inputs:
        PathtoPublish: 'frontend/dist/your-angular-project-name' # Adjust path
        ArtifactName: 'angular-drop'
        publishLocation: 'Container'

    - task: DotNetCoreCLI@2
      displayName: 'Restore NuGet packages'
      inputs:
        command: 'restore'
        projects: 'backend/YourBackendProjectName.csproj'

    - task: DotNetCoreCLI@2
      displayName: 'Build .NET Core app'
      inputs:
        command: 'build'
        projects: 'backend/YourBackendProjectName.csproj'
        arguments: '--configuration $(buildConfiguration)'

    - task: DotNetCoreCLI@2
      displayName: 'Run tests'
      inputs:
        command: 'test'
        projects: 'backend/YourBackendProjectName.csproj'

    - task: DotNetCoreCLI@2
      displayName: 'Publish .NET Core app'
      inputs:
        command: 'publish'
        publishWebProjects: true
        projects: 'backend/YourBackendProjectName.csproj'
        arguments: '--configuration $(buildConfiguration) --output $(Build.ArtifactStagingDirectory)'

    - task: PublishBuildArtifacts@1
      displayName: 'Publish .NET Core Artifact'
      inputs:
        PathtoPublish: '$(Build.ArtifactStagingDirectory)'
        ArtifactName: 'dotnet-drop'
        publishLocation: 'Container'