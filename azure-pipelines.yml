trigger:
  branches:
    include:
      - azure-pipelines

variables:
  buildConfiguration: 'Release'

stages:
  - stage: Build
    displayName: "Build & Publish .NET Core 8 API"
    jobs:
      - job: Build
        pool:
          vmImage: 'windows-latest'

        steps:
          # Install .NET 8 SDK
          - task: UseDotNet@2
            inputs:
              packageType: 'sdk'
              version: '8.x'

          # Restore dependencies
          - task: DotNetCoreCLI@2
            inputs:
              command: 'restore'
              projects: '**/*.csproj'

          # Build project
          - task: DotNetCoreCLI@2
            inputs:
              command: 'build'
              arguments: '--configuration $(buildConfiguration)'
              projects: '**/*.csproj'

          # Publish to folder
          - task: DotNetCoreCLI@2
            inputs:
              command: 'publish'
              publishWebProjects: true
              arguments: '--configuration $(buildConfiguration) --output $(Build.ArtifactStagingDirectory)'
              zipAfterPublish: true

          # Save artifact for deployment
          - task: PublishBuildArtifacts@1
            inputs:
              pathToPublish: '$(Build.ArtifactStagingDirectory)'
              artifactName: 'drop'
              publishLocation: 'Container'

  - stage: Deploy
    displayName: "Deploy to Azure App Service"
    dependsOn: Build
    jobs:
      - deployment: DeployWebAPI
        environment: 'SSO CICD'
        pool:
          vmImage: 'windows-latest'
        strategy:
          runOnce:
            deploy:
              steps:
                - task: DownloadBuildArtifacts@0
                  inputs:
                    buildType: 'current'
                    downloadType: 'single'
                    artifactName: 'drop'
                    downloadPath: '$(System.ArtifactsDirectory)'

                - task: AzureWebApp@1
                  inputs:
                    azureSubscription: 'SSOProductionConnection'
                    appType: 'webApp'
                    appName: 'sso-backend'
                    package: '$(System.ArtifactsDirectory)/drop/**/*.zip'
