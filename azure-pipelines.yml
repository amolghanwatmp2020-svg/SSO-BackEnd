# azure-pipelines-backend.yml
trigger:
- azure-pipelines # or your working branch name

pool:
  vmImage: 'windows-latest' # Using a Windows agent for a .NET project is a good practice

variables:
  buildConfiguration: 'Release'
  # Define the path to your project file relative to the repository root
  # This makes it easier to manage paths consistently
  projectFilePath: 'SingleSignOn/SingleSignOn.csproj' 

stages:
- stage: BuildBackend
  displayName: 'Build and package .NET Core API'
  jobs:
  - job: BuildJob
    displayName: 'Build .NET Core API'
    steps:

    # ... (existing restore, build, test tasks) ...

    - task: DotNetCoreCLI@2
      displayName: 'Publish .NET Core app'
      inputs:
        command: 'publish'
        publishWebProjects: true
        projects: 'SingleSignOn/SingleSignOn.csproj'
        arguments: '--configuration $(buildConfiguration) --output $(Build.ArtifactStagingDirectory)'

    # ❗ ADD THIS TASK to copy the static wwwroot files
    - task: CopyFiles@2
      displayName: 'Copy wwwroot folder to staging'
      inputs:
        SourceFolder: '$(Build.SourcesDirectory)/SingleSignOn' # Path to your project's root folder
        Contents: 'wwwroot/**' # This pattern copies the entire wwwroot folder and its contents
        TargetFolder: '$(Build.ArtifactStagingDirectory)'
      condition: succeeded()

    - task: PublishBuildArtifacts@1
      displayName: 'Publish .NET Core Artifact'
      inputs:
        PathtoPublish: '$(Build.ArtifactStagingDirectory)'
        ArtifactName: 'dotnet-drop'
        publishLocation: 'Container'

- stage: DeployBackend
  displayName: 'Deploy .NET Core API'
  jobs:
  - deployment: DeployJob
    displayName: 'Deploy API to Azure App Service'
    environment: 'SSO CICD'
    strategy:
      runOnce:
        deploy:
          steps:
          - task: AzureWebApp@1
            displayName: 'Deploy to Azure App Service'
            inputs:
              azureSubscription: 'SSOProductionConnection'
              appType: 'webApp'
              appName: 'sso-backend'
              package: '$(Pipeline.Workspace)/dotnet-drop' # Path to your artifact
              # Note: Azure DevOps will automatically find and use the zip file within this folder